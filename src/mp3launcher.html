<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Launching Arati Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1a1a1a;
      color: white;
      font-family: sans-serif;
    }
    .message {
      text-align: center;
      padding: 1.5rem;
      font-size: 1.2rem;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="message">Launching Arati Player...</div>
  <iframe src="ui.html" onload="document.querySelector('.message').style.display='none';"></iframe>
</body>
</html>
